<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  
  <style>
    *{
      padding: 0px;
      margin: 0px;
      border: 0px;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: normal;
    }

    .contenedor{
      width: 90%;
      margin: 0 auto;
      background-color: antiquewhite;
      padding: .5rem;
      text-align: center;
    }

    .tarjeta{
      padding: 1rem; /* Tamaño <M> */
      width: 350px;
      background-color: aqua;
      display: inline-block;
      border-radius: 10px;
      margin-bottom: .25rem; /* Separacion inferior */
    }

    .tarjeta a{
      text-decoration: none;
      font-size: 12px;
    }

    .tarjeta a:hover{
      text-decoration: underline;
    }

    .tarjeta h5{
      font-style: italic;
      margin-bottom: .25rem;
    }
  </style>

  <select name="selector-carreras" id="selector-carreras">
    <option value="">Mostrar todas</option>
    <option value="Ingenieria de Software">Ingenieria de Software</option>
    <option value="Diseño Grafico Digital">Diseño Grafico Digital</option>
    <option value="Administracion">Administracion</option>
  </select>

  <div class="contenedor">
   
  </div>

  <script>
    /* Imaginemos que los datos para las tarjetas vienen en una consulta */
    /* Con esta informacion ¿como las renderizamos? */
    const alumnos = [
      {
        apellidos: "Zapata Tores",
        nombres: "Alessandro del Piero",
        carrera: "Ingenieria de Software",
        telefono: "923748860",
        correo: "1668403@senati.pe"
      },
      {

      },

        correo: "kevin@gmail.com"
      },

    ]
  
    const contenedor = document.querySelector(".contenedor") // .=clase
    const selector = document.getElementById('selector-carreras')

    //Evento (¿Cuando ejecutamos la instruccion?)
    selector.addEventListener("change", function(){
      renderizarTarjetas(selector.value)
    })
    
      //Continuamos...
      //Manejo de DOM Document Object Model
      //Esta funcion requiere el nombre de una carrera (opcional), aplicar
      //el filtro con el nombre de la carrera, en caso este vacia, mostrar
      function renderizarTarjetas(carrera = ""){
      let listaFiltrada = []
      contenedor.innerHTML = ''
      
      /*if (carrera.trim() === ""){
        listaFiltrada = alumnos
      }else{
        listaFiltrada = alumnos.filter(alumno => alumno.carrera == carrera)
      }*/

      listaFiltrada =
      carrera.trim()===""
      ? alumnos
      : alumnos.filter(alumno => alumno.carrera == carrera)

      //Paso 1- Recorrer todo el arreglo
        listaFiltrada.forEach(alumno =>{
        const nuevaTarjeta = `
        <div class="tarjeta">
          <h4>${alumno.apellidos} ${alumno.nombres}</h4>
          <h5>${alumno.carrera}</h5>
          <a href="tel:${alumno.telefono}">Contactar</a>
          <a href="mailto:${alumno.correo}">Enviar correo</a>
        </div>
        `
        contenedor.innerHTML += nuevaTarjeta
      })
    }

    renderizarTarjetas("")
  </script>
</body>
</html>
